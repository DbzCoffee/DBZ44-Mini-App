    .select-btn {

    .select-btn strong {

    .dropdown {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      z-index: 15;
      background: #241914;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 7px;
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
      display: none;
    }

    .dropdown.open { display: block; }

    .dropdown button {
      width: 100%;
      border: 0;
      background: transparent;
      padding: 13px 12px;
      border-radius: 13px;

    }

    .dropdown button:hover,
    .dropdown button.selected {
      background: rgba(239,107,78,.12);

    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));

    .products-grid .product-body {
      min-height: 76px;
    }

    .empty {
      grid-column: 1 / -1;

    .nav-inner {

    .nav-btn {
      border: 0;

      color: #746960;

      display: flex;
      flex-direction: column;

    }

    .nav-btn .nav-icon {
      font-size: 23px;

    }

    .nav-btn.active {
      color: var(--accent);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-height) + 20px);
      transform: translate(-50%, 15px);
      opacity: 0;
      pointer-events: none;
      background: #2a211c;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 13px;
      transition: .22s ease;
      z-index: 50;

    }

    .toast.show {
      opacity: 1;

    }

    @media (min-width: 700px) {
      main { padding-left: 28px; padding-right: 28px; }

        padding-left: 28px;
        padding-right: 28px;
      }
      .products-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
  </style>

<body>
  <div class="app">

  <div class="toast" id="toast"></div>

  <script>
    /*
      ============================================================
      CATALOGUE — REMPLIS CETTE PARTIE MANUELLEMENT
      ============================================================

      Pour ajouter un produit, copie un bloc et modifie :
      - name
      - price
      - image
      - category
      - collection
      - description
      - featured

      "featured: true" => apparaît dans ⭐ Coups de cœur.

      Pour les images, tu peux utiliser :
      - une URL d'image
      - ou plus tard remplacer par un chemin local, ex: "images/produit1.jpg"
    */

    const PRODUCTS = [
      {
        id: 1,
        name: "Jaune mousseux 🧽",
        price: "
        • 1,6g → 10€
        • 3,2g → 20€
        • 5g → 30€
        • 10g → 50€
        • 25g → 100€
        • 50g → 180€",
        image: "https://placehold.co/800x800/2b211c/fff5ec?text=Produit+01",
        category: "HASH",
        collection: "Collection 1",
        description: "TOP MOUSSE.",
        featured: true
      },
      {
        id: 2,
        name: "✅ Amnesia Haze 🇪🇸",
        price: "
          • 2,5g → 20€
          • 5g → 40€
          • 10g → 70€",
        image: "https://placehold.co/800x800/30241e/fff5ec?text=Produit+02",
        category: "FLEURS",
        collection: "Collection 1",
        description: "Description du produit.",
        featured: true
      },
      {
        id: 3,
        name: "✅ Zip ❄️",
        price: "
          • 0,5g → 30€
          • 1g → 60€
          • 2g → 120€
          • 5g → 250€ €",
        image: "https://placehold.co/800x800/33271f/fff5ec?text=Produit+03",
        category: "DUR",
        collection: "Collection 2",
        description: "Description du produit.",
        featured: false
      },
      {
        id: 4,
        name: "✅ Tazz 280mg 💊",
        price: "
          • 1 pilule → 10€ 
          • 5 pilule → 40€ 
          • 10 pilule → 70€€",
        image: "https://placehold.co/800x800/2d231e/fff5ec?text=Produit+04",
        category: "DUR",
        collection: "Collection 2",
        description: "Description du produit.",
        featured: false
      },
      {
        id: 5,
        name: "Marlboro Suisse🇨🇭",
        price: "
          • 5 paquet 30€
          • 1 cartouche 50€€",
        image: "https://placehold.co/800x800/34271f/fff5ec?text=Produit+05",
        category: "TABAC",
        collection: "Collection 3",
        description: "Description du produit.",
        featured: false
      },
      {
        id: 6,
        name: "Produit 06",
        price: "100 €",
        image: "https://placehold.co/800x800/2c221d/fff5ec?text=Produit+06",
        category: "Catégorie 3",
        collection: "Collection 3",
        description: "Description du produit.",
        featured: false
      }
    ];

    /*
      ============================================================
      CONFIGURATION
      ============================================================
    */

    const CONFIG = {
      shopName: "DBZ COFFEE",

      // Mets ici le username Telegram de contact, sans @
      contactUsername: "cfdbz44"
    };

    /*
      ============================================================
      APPLICATION
      ============================================================
    */

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      // Permet à Telegram d'adapter l'interface à son thème si besoin.
      if (tg.setHeaderColor) tg.setHeaderColor("#120d0a");
      if (tg.setBackgroundColor) tg.setBackgroundColor("#120d0a");
    }

    const state = {
      category: "Toutes",
      collection: "Toutes",
      favorites: JSON.parse(localStorage.getItem("favorites") || "[]")
    };

    const $ = (selector) => document.querySelector(selector);

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getUserFirstName() {
      const user = tg?.initDataUnsafe?.user;

      if (user?.first_name) return user.first_name;

      return "Bienvenue";
    }

    function uniqueValues(key) {
      return [...new Set(PRODUCTS.map(p => p[key]).filter(Boolean))];
    }

    function isFavorite(id) {
      return state.favorites.includes(id);
    }

    function toggleFavorite(id) {
      if (state.favorites.includes(id)) {
        state.favorites = state.favorites.filter(item => item !== id);
        showToast("Retiré des favoris");
      } else {
        state.favorites.push(id);
        showToast("Ajouté aux favoris ❤️");
      }

      localStorage.setItem("favorites", JSON.stringify(state.favorites));
      renderAll();
    }

    function filteredProducts() {
      return PRODUCTS.filter(product => {
        const categoryOk =
          state.category === "Toutes" ||
          product.category === state.category;

        const collectionOk =
          state.collection === "Toutes" ||
          product.collection === state.collection;

        return categoryOk && collectionOk;
      });
    }

    function productCard(product, featured = false) {
      return `
        <article class="${featured ? "featured-card" : ""}">
          <div class="product-card">
            <div class="product-image-wrap">
              <img
                class="product-image"
                src="${escapeHtml(product.image)}"
                alt="${escapeHtml(product.name)}"
                loading="lazy"
              />
              <button
                class="favorite ${isFavorite(product.id) ? "active" : ""}"
                onclick="toggleFavorite(${product.id})"
                aria-label="Favori"
              >
                ${isFavorite(product.id) ? "♥" : "♡"}
              </button>
            </div>
            <div class="product-body">
              <h3 class="product-name">${escapeHtml(product.name)}</h3>
              <div class="product-meta">Dès ${escapeHtml(product.price)}</div>
            </div>
          </div>
        </article>
      `;
    }

    function renderFeatured() {
      const featured = PRODUCTS.filter(p => p.featured);
      const container = $("#featuredRow");

      if (!featured.length) {
        container.innerHTML = `<div class="empty">Aucun coup de cœur pour le moment.</div>`;
        return;
      }

      container.innerHTML = featured.map(p => productCard(p, true)).join("");
    }

    function renderProducts() {
      const products = filteredProducts();
      const container = $("#productsGrid");

      $("#productCount").textContent =
        `${products.length} ${products.length > 1 ? "articles" : "article"}`;

      if (!products.length) {
        container.innerHTML = `
          <div class="empty">
            Aucun produit ne correspond à ces filtres.
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(p => productCard(p)).join("");
    }

    function renderDropdowns() {
      const categories = ["Toutes", ...uniqueValues("category")];
      const collections = ["Toutes", ...uniqueValues("collection")];

      $("#categoryDropdown").innerHTML = categories.map(item => `
        <button
          class="${state.category === item ? "selected" : ""}"
          onclick="selectCategory('${escapeJs(item)}')"
        >
          ${escapeHtml(item)}
        </button>
      `).join("");

      $("#collectionDropdown").innerHTML = collections.map(item => `
        <button
          class="${state.collection === item ? "selected" : ""}"
          onclick="selectCollection('${escapeJs(item)}')"
        >
          ${escapeHtml(item)}
        </button>
      `).join("");

      $("#categoryLabel").textContent =
        state.category === "Toutes" ? "Catégories" : state.category;

      $("#collectionLabel").textContent =
        state.collection === "Toutes" ? "Collections" : state.collection;
    }

    function escapeJs(value) {
      return String(value).replaceAll("\\", "\\\\").replaceAll("'", "\\'");
    }

    function selectCategory(value) {
      state.category = value;
      closeDropdowns();
      renderAll();
    }

    function selectCollection(value) {
      state.collection = value;
      closeDropdowns();
      renderAll();
    }

    function closeDropdowns() {
      document.querySelectorAll(".dropdown").forEach(el => el.classList.remove("open"));
    }

    function renderAll() {
      renderFeatured();
      renderProducts();
      renderDropdowns();
    }

    function showPage(page) {
      $("#homePage").style.display = page === "home" ? "block" : "none";
      $("#contactPage").style.display = page === "contact" ? "block" : "none";

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.page === page);
      });

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showToast(message) {
      const toast = $("#toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 1600);
    }

    // Navigation
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => showPage(btn.dataset.page));
    });

    $("#topContact").addEventListener("click", () => showPage("contact"));

    // Dropdowns
    $("#categoryBtn").addEventListener("click", (event) => {
      event.stopPropagation();
      $("#categoryDropdown").classList.toggle("open");
      $("#collectionDropdown").classList.remove("open");
    });

    $("#collectionBtn").addEventListener("click", (event) => {
      event.stopPropagation();
      $("#collectionDropdown").classList.toggle("open");
      $("#categoryDropdown").classList.remove("open");
    });

    document.addEventListener("click", closeDropdowns);

    // Configuration visuelle / identité
    $("#brandName").textContent = CONFIG.shopName;

    const contactLink = $("#contactLink");
    contactLink.href = `https://t.me/${CONFIG.contactUsername}`;

    $("#firstName").textContent = getUserFirstName();

    renderAll();
  </script>
</body>
